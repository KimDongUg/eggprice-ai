services:
  - type: web
    name: eggprice-api-docker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eggprice-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: CELERY_BROKER_URL
        value: ""
      - key: CORS_ORIGINS
        value: https://frontend-my-news.vercel.app,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RATE_LIMIT_STORAGE_URI
        value: "memory://"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-my-news.vercel.app
      - key: SENTRY_DSN
        value: ""
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: KAMIS_API_KEY
        value: "3f3dce20-9ad0-433f-b92f-3b4ecd2e3335"
      - key: KAMIS_API_ID
        value: "test"

  # Cron: Daily data collection at 6AM KST (21:00 UTC previous day)
  - type: cron
    name: eggprice-daily-collect
    runtime: image
    image:
      url: alpine:latest
    schedule: "0 21 * * *"
    region: singapore
    envVars:
      - key: CRON_SECRET
        fromService:
          name: eggprice-api-docker
          type: web
          envVarKey: CRON_SECRET
      - key: API_URL
        value: https://eggprice-api-docker.onrender.com
    startCommand: >-
      sh -c '
      echo "=== eggprice-daily-collect start ===";
      if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
        echo "ERROR: API_URL or CRON_SECRET is empty"; exit 1;
      fi;
      apk add --no-cache curl || { echo "ERROR: failed to install curl"; exit 1; };
      echo "Waking up API server...";
      curl -s --retry 5 --retry-delay 10 --retry-connrefused
      -o /dev/null -w "health_check: HTTP %{http_code} in %{time_total}s\n"
      "${API_URL}/api/v1/health" --max-time 180 ||
      { echo "ERROR: health check failed"; exit 1; };
      echo "Waiting 5s for server warmup..."; sleep 5;
      echo "Calling collect-data...";
      HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST
      "${API_URL}/api/v1/cron/collect-data"
      -H "x-cron-secret: ${CRON_SECRET}"
      -H "Content-Type: application/json"
      --max-time 300
      --retry 3 --retry-delay 30 --retry-connrefused) || {
        echo "ERROR: curl failed (exit $?)"; exit 1;
      };
      echo "HTTP Status: $HTTP_CODE";
      cat /tmp/resp.json 2>/dev/null; echo "";
      if [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
        echo "ERROR: collect-data failed with HTTP $HTTP_CODE"; exit 1;
      fi;
      echo "=== eggprice-daily-collect done ==="'

