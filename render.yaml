services:
  - type: web
    name: eggprice-api-docker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eggprice-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: CELERY_BROKER_URL
        value: ""
      - key: CORS_ORIGINS
        value: https://frontend-my-news.vercel.app,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RATE_LIMIT_STORAGE_URI
        value: "memory://"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-my-news.vercel.app
      - key: SENTRY_DSN
        value: ""
      - key: SENTRY_ENVIRONMENT
        value: production

  # Cron: Daily data collection at 6AM KST (21:00 UTC previous day)
  - type: cron
    name: eggprice-daily-collect
    runtime: image
    image:
      url: alpine:latest
    schedule: "0 21 * * *"
    region: singapore
    envVars:
      - key: CRON_SECRET
        fromService:
          name: eggprice-api-docker
          type: web
          envVarKey: CRON_SECRET
      - key: API_URL
        value: https://eggprice-api-docker.onrender.com
    startCommand: >-
      sh -c 'apk add --no-cache curl > /dev/null 2>&1 &&
      curl -s --retry 3 --retry-delay 10 --retry-connrefused
      -o /dev/null "${API_URL}/api/v1/health" --max-time 120 &&
      curl -sf -X POST
      "${API_URL}/api/v1/cron/collect-data"
      -H "x-cron-secret: ${CRON_SECRET}"
      -H "Content-Type: application/json"
      --max-time 300
      --retry 2 --retry-delay 30 --retry-connrefused'

  # Cron: Daily predictions at 7AM KST (22:00 UTC previous day)
  - type: cron
    name: eggprice-daily-predict
    runtime: image
    image:
      url: alpine:latest
    schedule: "0 22 * * *"
    region: singapore
    envVars:
      - key: CRON_SECRET
        fromService:
          name: eggprice-api-docker
          type: web
          envVarKey: CRON_SECRET
      - key: API_URL
        value: https://eggprice-api-docker.onrender.com
    startCommand: >-
      sh -c 'apk add --no-cache curl > /dev/null 2>&1 &&
      curl -s --retry 3 --retry-delay 10 --retry-connrefused
      -o /dev/null "${API_URL}/api/v1/health" --max-time 120 &&
      curl -sf -X POST
      "${API_URL}/api/v1/cron/run-predictions"
      -H "x-cron-secret: ${CRON_SECRET}"
      -H "Content-Type: application/json"
      --max-time 300
      --retry 2 --retry-delay 30 --retry-connrefused'

  # Cron: Daily accuracy evaluation at 8AM KST (23:00 UTC previous day)
  - type: cron
    name: eggprice-daily-evaluate
    runtime: image
    image:
      url: alpine:latest
    schedule: "0 23 * * *"
    region: singapore
    envVars:
      - key: CRON_SECRET
        fromService:
          name: eggprice-api-docker
          type: web
          envVarKey: CRON_SECRET
      - key: API_URL
        value: https://eggprice-api-docker.onrender.com
    startCommand: >-
      sh -c 'apk add --no-cache curl > /dev/null 2>&1 &&
      curl -s --retry 3 --retry-delay 10 --retry-connrefused
      -o /dev/null "${API_URL}/api/v1/health" --max-time 120 &&
      curl -sf -X POST
      "${API_URL}/api/v1/cron/evaluate-accuracy"
      -H "x-cron-secret: ${CRON_SECRET}"
      -H "Content-Type: application/json"
      --max-time 300
      --retry 2 --retry-delay 30 --retry-connrefused'

  # Cron: Daily news crawl at 9AM KST (00:00 UTC)
  - type: cron
    name: eggprice-daily-news
    runtime: image
    image:
      url: alpine:latest
    schedule: "0 0 * * *"
    region: singapore
    envVars:
      - key: CRON_SECRET
        fromService:
          name: eggprice-api-docker
          type: web
          envVarKey: CRON_SECRET
      - key: API_URL
        value: https://eggprice-api-docker.onrender.com
    startCommand: >-
      sh -c 'apk add --no-cache curl > /dev/null 2>&1 &&
      curl -s --retry 3 --retry-delay 10 --retry-connrefused
      -o /dev/null "${API_URL}/api/v1/health" --max-time 120 &&
      curl -sf -X POST
      "${API_URL}/api/v1/cron/crawl-news"
      -H "x-cron-secret: ${CRON_SECRET}"
      -H "Content-Type: application/json"
      --max-time 300
      --retry 2 --retry-delay 30 --retry-connrefused'

databases:
  - name: eggprice-db
    plan: free
    region: singapore
    databaseName: eggprice_db
    user: eggprice
